name: Günlük Sinyal Avcısı Videosu

on:
  schedule:
    # 07:00 Europe/Istanbul (UTC+3) = 04:00 UTC. Ses üretimi + render için
    # Buffer'daki 08:00 paylaşım saatinden 1 saat önce başlatılır.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      topicIndex:
        description: 'Belirli bir konu indeksi ile test et (0-10, boş bırakılırsa günün konusu seçilir)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      TOPIC_INDEX: ${{ inputs.topicIndex }}
      # publish-buffer.js GITHUB_TOKEN'ı GitHub Release oluşturup video
      # asset'i yüklemek için kullanır. GITHUB_REPOSITORY runner'da otomatik
      # gelir ama GITHUB_TOKEN job env'ine elle geçirilmezse process.env'de
      # BULUNMAZ — script bunu "yerel ortam" sanıp yayın adımını sessizce
      # atlar (exit 0). Bu satır olmadan job "başarılı" görünse de hiçbir
      # şey yayınlanmaz.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Chrome bağımlılıklarını kur (Remotion render için)
        run: npx remotion browser ensure

      - name: 1. Adım — ElevenLabs ile seslendirme üret
        run: npm run generate-audio

      - name: 2. Adım — Remotion ile videoyu render et
        run: npm run render-video

      - name: 3. Adım — Buffer ile Instagram'a yayınla
        run: npm run publish-buffer
